name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET build + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LON.sln

      - name: Build
        run: dotnet build LON.sln --no-restore --configuration Release

      - name: Integration tests (Testcontainers uses runner Docker)
        run: dotnet test tests/LON.IntegrationTests/LON.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: integration-test-report
          path: '**/test-results.trx'
          reporter: dotnet-trx

  frontend:
    name: Frontend build + contract diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 (for Swagger generator)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dotnet tools
        run: dotnet tool restore

      - name: Install frontend deps
        working-directory: frontend/web
        run: npm ci

      - name: Regenerate API types (detect contract drift)
        run: bash scripts/gen-api-types.sh

      - name: Fail if swagger.json or schema.d.ts drifted
        run: |
          if ! git diff --quiet api-contract/swagger.json frontend/web/src/api/schema.d.ts; then
            echo "❌ API contract drifted. Regenerate with ./scripts/gen-api-types.sh and commit."
            git --no-pager diff --stat api-contract/ frontend/web/src/api/
            exit 1
          fi
          echo "✅ API contract in sync."

      - name: Build frontend
        working-directory: frontend/web
        run: npm run build
