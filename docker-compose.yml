services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lon-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - lon-network
      - web
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  api:
    build:
      context: .
      dockerfile: src/LON.API/Dockerfile
    container_name: lon-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=LONDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=LON.API
      - JwtSettings__Audience=LON.Client
      - JwtSettings__ExpiryMinutes=60
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__EmbeddingModel=text-embedding-ada-002
      - OpenAI__ChatModel=gpt-4o-mini
      - EnableVectorStore=${ENABLE_VECTOR_STORE:-false}
    volumes:
      - lon_dataprotection_keys:/root/.aspnet/DataProtection-Keys
    expose:
      - "5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - lon-network
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.5"

  worker:
    build:
      context: .
      dockerfile: src/LON.Worker/Dockerfile
    container_name: lon-worker
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=LONDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__EmbeddingModel=text-embedding-ada-002
      - OpenAI__ChatModel=gpt-4o-mini
      - EnableVectorStore=${ENABLE_VECTOR_STORE:-false}
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - lon-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: lon-frontend
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - lon-network
      - web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  sqlserver_data:
  lon_dataprotection_keys:

networks:
  lon-network:
    driver: bridge
  web:
    external: true